<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <table>
        <thead>
          <tr>
            <th>NAME</th>
            <th>PHONE NUMBER</th>
            <th>EMAIL</th>
            <th>SUBJECT</th>
            <th>DESCRIPTION</th>
            <th>MANAGE</th>
          </tr>
        </thead>
        <tbody id="datalist"></tbody>
      </table>

      <button class="listbtn" id="btn">Add</button>
    </div>
    <div class="popup" id="POPUP">
      <form class="CONTAINER">
        <div class="POPUP">
          <div style="display: flex; justify-content: space-between">
            <h2 class="HEADING">Contact Us</h2>
            <button type="button" class="HEADINBTN" id="headingbtn">X</button>
          </div>

          <div class="NAME">
            <label class="lable">FULL NAME</label>
            <input
              placeholder="Enter name"
              class="GRID"
              id="name"
              type="text"
              maxlength="30"
              required
            />
            <p id="NAMEERROR" class="ERROR"></p>
          </div>

          <div class="CONTACT grid grid-cols-2 gap-3">
            <div>
              <label class="lable">PHONE NUMBER</label>
              <input
                placeholder="Enter phone number"
                class="GRIDCOl"
                id="number"
                type="tel"
                maxlength="10"
                required
              />
              <p id="PHONEERROR" class="ERROR"></p>
            </div>

            <div>
              <label class="lable">EMAIL</label>
              <input
                placeholder="Enter email"
                id="Email"
                class="GRIDCOl ,ERROR"
                type="email"
                maxlength="40"
                required
              />
              <p id="emailError" class="ERROR"></p>
            </div>
          </div>
          <div>
            <label class="lable">SUBJECT</label>
            <input
              placeholder="Enter subject"
              maxlength="50"
              class="GRID"
              id="subject"
              type="text"
            />
          </div>
          <div>
            <label class="lable">DESCRIPTION</label>
            <input
              placeholder="Enter discription"
              maxlength="100"
              class="GRID"
              id="discription"
              type="text"
            />
          </div>
          <div class="POPUPBUTTON">
            <button type="submit" id="submitbtn" class="BUTTON">Submit</button>
            <button type="button" id="canclebtn" class="BUTTON">Cancel</button>
          </div>
        </div>
      </form>
    </div>
    <script src="site.js"></script>
    <script src="validation.js"></script>
    <script src="Ls.js"></script>
  </body>
</html>
